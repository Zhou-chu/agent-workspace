name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Check runtime module boundaries
        if: runner.os == 'Linux'
        run: npm run check:architecture
      - run: npm test
      - name: Verify Windows bootstrap executable selection
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./test/deploy-bootstrap.test.ps1
          $checked = & ./deploy/windows-bootstrap.ps1 -Mode Check | ConvertFrom-Json
          if (!$checked.npmValidated -or $checked.persisted -ne 'none') { throw 'Bootstrap read-only check did not validate bundled npm.' }
      - name: Rehearse split Windows supervisor with frozen production dependencies
        if: runner.os == 'Windows'
        env:
          AGENTCHAT_REHEARSE_NPM: '1'
        run: node --test --test-name-pattern="supervisor activates the built" test/deploy-lifecycle.test.mjs
