name: SonarQube Cloud
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    if: vars.SONAR_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: mkdir -p coverage && npm run coverage
      - name: Require coverage report
        run: test -s coverage/lcov.info
      - name: Scan and enforce the Quality Gate
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.scanner.metadataFilePath=${{ runner.temp }}/agent-workspace-sonar-receipt.txt
      - name: Summarize the exact Sonar Quality Gate
        if: ${{ !cancelled() && (steps.sonar_scan.outcome == 'success' || steps.sonar_scan.outcome == 'failure') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_RECEIPT: ${{ runner.temp }}/agent-workspace-sonar-receipt.txt
        run: node scripts/sonar-gate.mjs
